name: Site Watchdog

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check site
        env:
          WATCHDOG_MAIL_USER: ${{ secrets.WATCHDOG_MAIL_USER }}
          WATCHDOG_MAIL_PASS: ${{ secrets.WATCHDOG_MAIL_PASS }}
        run: python scripts/site_watchdog.py

      - name: Save watchdog state
        run: |
          git config user.name "vm-watchdog"
          git config user.email "vm-watchdog@users.noreply.github.com"
          git add watchdog/state.json
          git diff --cached --quiet || git commit -m "watchdog: update state"
          git push
